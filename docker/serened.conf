# SereneDB config (mounted over /etc/serenedb/serened.conf). absl flagfile: one --flag=value per line.

--server_directory=/var/lib/serenedb

# Postgres wire on 7890 + OTLP/HTTP ingest on 4318 (POST /v1/logs -> otel_logs, created at startup).
--listen=postgres://0.0.0.0:7890,http://0.0.0.0:4318?api=otel

--log_level=info
--log_storage=stdout
