# Dev question set (plan 009). Written by Claude after seeing the data, so for development only; the honest test is the
# human-written private question set (see docs, same format). BGL questions use the tune part only (< 2005-12-05).
# golden[].sql is the hand-written reference query; eval/build_golden.py runs it once and stores `value`.
# match: number (default) | date (YYYY-MM-DD HH:MM prefix) | text. must_mention: strings the answer must contain.
# topic: questions sharing a topic are the same subject asked by different roles (E4 role distinctness).

- id: D-E01
  role: engineer
  pattern: E1
  dataset: bgl
  question: What failed on the R43-M0 midplane around 2005-08-19 13:56, and what happened just before and after?
  golden:
  - fact: kernel panic lines on R43-M0, 2005-08-19 13:40-14:15
    sql: SELECT count(*) FROM logs WHERE dataset='bgl' AND midplane='R43-M0' AND body @@ websearch_to_tsquery('kernel panic') AND ts >= '2005-08-19 13:40' AND ts < '2005-08-19 14:15'
    value: 2
  - fact: first panic time
    match: date
    sql: SELECT strftime(min(ts), '%Y-%m-%d %H:%M') FROM logs WHERE dataset='bgl' AND midplane='R43-M0' AND body @@ websearch_to_tsquery('kernel panic') AND ts >= '2005-08-19 13:40' AND ts < '2005-08-19
      14:15'
    value: 2005-08-19 13:56
  must_mention:
  - R43-M0
  - kernel panic
  required_tools:
  - search_logs
  - get_context
  expected_first_tool: search_logs
