- id: D-E05
  role: engineer
  pattern: E2
  dataset: bgl
  topic: ciod-nov
  question: 'On 2005-11-17 BGL I/O nodes started logging ''ciod: Error reading message prefix ... Link has been severed''. What failed, where did it start, and what happened just before?'
  golden:
  - fact: Link has been severed (ciod prefix) lines on 2005-11-17
    sql: 'SELECT count(*) FROM logs l JOIN patterns p ON p.dataset=l.dataset AND p.pattern_id=l.pattern_id WHERE l.dataset=''bgl'' AND p.template = ''ciod: Error reading message prefix on CioStream socket
      to <N>, Link has been severed'' AND l.ts >= ''2005-11-17'' AND l.ts < ''2005-11-18'''
    value: 1008
  - fact: first occurrence
    match: date
    sql: 'SELECT strftime(min(l.ts), ''%Y-%m-%d %H:%M'') FROM logs l JOIN patterns p ON p.dataset=l.dataset AND p.pattern_id=l.pattern_id WHERE l.dataset=''bgl'' AND p.template = ''ciod: Error reading message
      prefix on CioStream socket to <N>, Link has been severed'''
    value: 2005-11-17 05:33
  must_mention:
  - ciod
  required_tools:
  - search_logs
  - get_context
  expected_first_tool: search_logs
