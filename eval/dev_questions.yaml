- id: D-E07
  role: engineer
  pattern: E4
  dataset: openstack
  question: Were any OpenStack VMs abnormally slow to start? Which ones, and how slow compared with normal?
  golden:
  - fact: slowest spawn time in seconds
    sql: SELECT round(max(CAST(regexp_extract(body, 'Took ([\d.]+) seconds to spawn', 1) AS DOUBLE)), 2) FROM logs WHERE dataset='openstack' AND body LIKE '%seconds to spawn the instance%'
    value: 50.72
  - fact: normal (median) spawn time in seconds
    sql: SELECT round(median(CAST(regexp_extract(body, 'Took ([\d.]+) seconds to spawn', 1) AS DOUBLE)), 2) FROM logs WHERE dataset='openstack' AND body LIKE '%seconds to spawn the instance%'
    value: 19.74
  must_mention:
  - a445709b
  required_tools:
  - value_outliers
  expected_first_tool: value_outliers
