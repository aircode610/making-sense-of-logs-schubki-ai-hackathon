# Dev question set (plan 009). Written by Claude after seeing the data, so for development only; the honest test is the
# human-written private question set (see docs, same format). BGL questions use the tune part only (< 2005-12-05).
# golden[].sql is the hand-written reference query; eval/build_golden.py runs it once and stores `value`.
# match: number (default) | date (YYYY-MM-DD HH:MM prefix) | text | order (E6, plan 010: hand-picked phrases of the
#   computed top items, in rank order; `tool` + `args` = the call build_golden.py re-runs to verify them).
# must_mention: strings the answer must contain; must_not: strings it must not contain outside its unknowns.
# expected_first_tool: one tool or a list of valid first tools.
# topic: questions sharing a topic are the same subject asked by different roles (E4 role distinctness).

- id: D-E01
  role: engineer
  pattern: E1
  dataset: bgl
  question: What failed on the R43-M0 midplane around 2005-08-19 13:56, and what happened just before and after?
  golden:
  - fact: kernel panic lines on R43-M0, 2005-08-19 13:40-14:15
    sql: SELECT count(*) FROM logs WHERE dataset='bgl' AND location @@ ts_tokenize('R43/R43-M0', 'keyword') AND body @@ websearch_to_tsquery('kernel panic') AND ts >= '2005-08-19 13:40' AND ts < '2005-08-19
      14:15'
    value: 2
  - fact: first panic time
    match: date
    sql: SELECT strftime(min(ts), '%Y-%m-%d %H:%M') FROM logs WHERE dataset='bgl' AND location @@ ts_tokenize('R43/R43-M0', 'keyword') AND body @@ websearch_to_tsquery('kernel panic') AND ts >= '2005-08-19
      13:40' AND ts < '2005-08-19 14:15'
    value: 2005-08-19 13:56
  must_mention:
  - R43-M0
  - kernel panic
  required_tools:
  - search_logs
  - get_context
  expected_first_tool: search_logs
