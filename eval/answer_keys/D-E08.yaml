id: D-E08
role: engineer
dataset: bgl
question: "BGL KERNEL logged FATAL lines on 2005-11-17 between 05:00 and 06:00. Is that rate unusual compared with the previous 7 days?"
answer_summary: "KERNEL FATAL logged 245 lines in 2005-11-17 05:00-06:00, against 8,044 in the previous 7 days (2005-11-10 05:00 to 2005-11-17 05:00), a mean of 47.9 lines/hour. That makes the hour about 5x the mean. It is not the largest hour, though: the baseline is very bursty (only 21 of 168 hours have any lines) and 5 baseline hours were higher, up to 4,097. Those big baseline hours were fleet-wide job-termination sweeps ('rts: kernel terminated for reason 1004' plus 'Error receiving packet on tree network' on 512 to 2,048 nodes at once). The 05:00 hour is unusual in what it contains, not in how many lines it has: 195 lines are a single machine-check crash dump from one compute node (R36-M1-N0-C:J16-U11, its third dump since 04:22), 48 lines are 'Power Good signal deactivated' for the 16 node cards of midplane R73-M1 (3 sweeps), and 2 lines are 'Invalid JtagId' on R73-M1-N5. Neither signature appears at all in the 7-day baseline, and both appear for the first time in the whole dataset on 2005-11-17. Verdict: elevated, but not a record by line count. It is new and localised (one node plus one midplane), so it needs attention as a hardware issue on those two places, not as a fleet-wide event."
findings:
  - fact: "Target hour has 245 KERNEL FATAL lines; previous 7 days have 8,044 (mean 47.9/hour over 168 hours), so ~5.1x the hourly mean."
    sql: "SELECT count(*) FROM logs WHERE dataset='bgl' AND component='KERNEL' AND severity='FATAL' AND ts >= '2005-11-17 05:00' AND ts < '2005-11-17 06:00'  -- and same with ts >= '2005-11-10 05:00' AND ts < '2005-11-17 05:00'"
    result: "245 ; 8044"
    importance: must
  - fact: "The baseline is extremely bursty: only 21 of 168 baseline hours are non-zero (median of non-zero hours 46, max 4,097). 5 baseline hours had >= 245 lines (11-15 19:00 = 4097, 11-10 19:00 = 1073, 11-16 12:00 = 1025, 11-14 18:00 = 1025, 11-17 04:00 = 407). So by raw count the hour ranks about 6th of 169, not an outlier. The same clock hour (05:00) had 0 lines on every one of the 7 previous days."
    sql: "WITH h AS (SELECT date_trunc('hour',ts) hr, count(*) n FROM logs WHERE dataset='bgl' AND component='KERNEL' AND severity='FATAL' AND ts >= '2005-11-10 05:00' AND ts < '2005-11-17 05:00' GROUP BY 1) SELECT count(*) hours_nonzero, max(n), quantile_cont(n,0.5), sum(n), round(sum(n)/168.0,1), sum(CASE WHEN n>=245 THEN 1 ELSE 0 END) FROM h"
    result: "21|4097|46|8044|47.9|5"
    importance: must
  - fact: "Lines are not incidents. The 245 lines are: 195 lines = ONE machine-check crash register dump from compute node R36-M1-N0-C:J16-U11 at 05:19:02-05:19:30 (starting 'Machine Check Status Register: 0xa0800000'); 48 lines = 'Power Good signal deactivated: R73-M1-N<x>. A service action may be required.' for the 16 node cards of midplane R73-M1, in 3 sweeps (05:32 with node NULL, 05:41 and 05:42 attributed to R50-M1-NC-I:J18-U11); 2 lines = 'Invalid JtagId = ffffffff' on R73-M1-N5-C:J09-U11. Only 3 distinct reporting nodes."
    sql: "SELECT coalesce(node,'NULL'), date_trunc('minute',ts), count(*) FROM logs WHERE dataset='bgl' AND component='KERNEL' AND severity='FATAL' AND ts >= '2005-11-17 05:00' AND ts < '2005-11-17 06:00' GROUP BY 1,2 ORDER BY 2"
    result: "R36-M1-N0-C:J16-U11|05:19|195 ; NULL|05:32|16 ; R73-M1-N5-C:J09-U11|05:41|1 ; R50-M1-NC-I:J18-U11|05:41|16 ; R73-M1-N5-C:J09-U11|05:42|1 ; R50-M1-NC-I:J18-U11|05:42|16"
    importance: must
  - fact: "The big baseline hours are a different kind of event: fleet-wide job-termination sweeps ('rts: kernel terminated for reason 1004' and 'Error receiving packet on tree network', 3,584 lines each in the 7 days, on 512-2,048 nodes per hour), with 0 machine-check dumps and 0 Power Good lines in those hours."
    sql: "SELECT date_trunc('hour',ts), count(*), count(DISTINCT node), sum(CASE WHEN body LIKE 'Machine Check Status Register%' THEN 1 ELSE 0 END), sum(CASE WHEN body LIKE 'Power Good signal deactivated%' THEN 1 ELSE 0 END) FROM logs WHERE dataset='bgl' AND component='KERNEL' AND severity='FATAL' AND ts >= '2005-11-10 05:00' AND ts < '2005-11-17 06:00' GROUP BY 1 HAVING count(*)>=100 ORDER BY 1"
    result: "11-10 19:00|1073|513|0|0 ; 11-14 18:00|1025|512|0|0 ; 11-15 19:00|4097|2048|0|0 ; 11-16 12:00|1025|512|0|0 ; 11-17 04:00|407|18|2|0 ; 11-17 05:00|245|3|1|48"
    importance: must
  - fact: "Both signatures in the target hour are new. 'Machine Check Status Register' first appears anywhere in BGL at 2005-11-17 04:22:14, and the first three dumps are all on R36-M1-N0-C:J16-U11 (04:22, 04:32, 05:19), so the 05:19 dump is a repeat crash of the same node. 'Power Good signal deactivated' first appears anywhere in BGL at 2005-11-17 05:32:47 and continues after the window (06:12 sweep)."
    sql: "SELECT ts, node, left(body,60) FROM logs WHERE dataset='bgl' AND component='KERNEL' AND body LIKE 'Machine Check Status Register%' AND ts >= '2005-10-17' AND ts < '2005-11-18 06:00' ORDER BY ts LIMIT 30 ; SELECT min(ts), max(ts), count(*) FROM logs WHERE dataset='bgl' AND body LIKE 'Power Good signal deactivated%'"
    result: "04:22:14 / 04:32:22 / 05:19:02 all R36-M1-N0-C:J16-U11 (dataset total: 56 dumps on 30 nodes, first 2005-11-17 04:22) ; Power Good: first 2005-11-17 05:32:47, last 2005-12-04 11:15:28, 94 lines"
    importance: should
  - fact: "Sequence before and after: 04:06 'MailboxMonitor::serviceMailboxes() lib_ido_error: -1019 socket closed' on 17 I/O nodes; 04:22 and 04:32 machine-check dumps (195 lines each) on R36-M1-N0; 05:19 third dump; 05:32/05:41/05:42 Power Good sweeps on R73-M1; after the window, another Power Good sweep at 06:12 and 15 lines at 06:47 from R50-M1-NC-I."
    sql: "SELECT date_trunc('minute',ts), count(*) FROM logs WHERE dataset='bgl' AND component='KERNEL' AND severity='FATAL' AND ts >= '2005-11-17 03:00' AND ts < '2005-11-17 07:00' GROUP BY 1 ORDER BY 1"
    result: "04:06|17 ; 04:22|195 ; 04:32|195 ; 05:19|195 ; 05:32|16 ; 05:41|17 ; 05:42|17 ; 06:12|16 ; 06:47|15"
    importance: should
  - fact: "A 30-day hourly baseline gives the same picture: 11 of 720 hours (11 of 114 non-zero hours) reached >= 245 lines; mean 21.5/hour."
    sql: "WITH h AS (SELECT date_trunc('hour',ts) hr, count(*) n FROM logs WHERE dataset='bgl' AND component='KERNEL' AND severity='FATAL' AND ts >= '2005-10-18 05:00' AND ts < '2005-11-17 05:00' GROUP BY 1) SELECT count(*), sum(CASE WHEN n>=245 THEN 1 ELSE 0 END), round(sum(n)/720.0,1) FROM h"
    result: "114|11|21.5"
    importance: nice
  - fact: "Ownership: KERNEL belongs to node-platform; the Power Good / environmental angle may also involve MONITOR / HARDWARE (cluster-control / node-platform)."
    sql: "SELECT * FROM ownership WHERE dataset='bgl' LIMIT 20"
    result: "bgl|KERNEL|node-platform|Compute-node kernel ... ; bgl|HARDWARE|node-platform ; bgl|MONITOR|cluster-control|Environmental monitoring (power, temperature)"
    importance: nice
must_conclude:
  - "States both counts (245 in the hour vs 8,044 in the previous 7 days, about 48/hour) and compares at the same granularity (per hour)."
  - "Says the hour is elevated against the mean (~5x) but is NOT the peak: several baseline hours were higher (up to 4,097), because the baseline is bursty and mostly zero."
  - "Breaks the 245 lines down: one 195-line machine-check dump from a single node (R36-M1-N0-C:J16-U11) plus 'Power Good signal deactivated' on midplane R73-M1 node cards. Few incidents, not 245."
  - "Notes these signatures are absent from the 7-day baseline (new), whereas the baseline's big hours are fleet-wide job-termination sweeps. What makes the hour unusual is its content and its scope (localised), more than its volume."
  - "Next steps: inspect R36-M1-N0-C:J16-U11 (repeated machine checks: 04:22, 04:32, 05:19) and the power on midplane R73-M1 (Power Good lost on all 16 node cards), owned by node-platform."
traps:
  - "Calling it a massive anomaly just from 245 vs 47.9/hour (5x) without noticing that 5 baseline hours were higher, one of them 4,097."
  - "Dividing 8,044 by 7 days and comparing a daily mean (~1,149/day) with an hourly count, or comparing the hour with the whole week's total."
  - "Saying it is 'not unusual' because the counts are lower than the peaks, and missing that the failure signatures are new (machine check, Power Good) and localised."
  - "Treating 245 lines as 245 failures or incidents. 195 of them are one crash register dump from one node."
  - "Calling it fleet-wide: only 3 reporting nodes (one compute node, one I/O node, one R73 node card), affecting one compute node and one midplane."
  - "Comparing with a 7-day window that includes the target hour or is anchored at midnight (e.g. Nov 10-16 calendar days), which shifts the totals."
  - "Linking the R36 machine checks and the R73 Power Good loss as one cause; they are on different racks and only co-occur in time."
not_established:
  - "The root cause of the machine checks on R36-M1-N0-C:J16-U11 (the dump shows a data read PLB error, but not why) or of the Power Good loss on R73-M1 (a power-supply fault, a planned service action or a power-down cannot be told apart from these lines)."
  - "Whether the R36 node crashes and the R73 power events are related."
  - "Any job or user impact, downtime, or whether the R73 Power Good sweeps were a maintenance action."
  - "Why the Power Good lines are attributed to I/O node R50-M1-NC-I:J18-U11 or have no node (reporting artefact versus a real location)."
labels_used: "Of the 245 lines, 50 carry Loghub alert labels: 48 KERNSERV (the Power Good lines), 1 KERNMC and 1 KERNRTSP (inside the R36 machine-check dump). The labels confirm that real alerts occurred in the hour (two alert types) and that most of the 195-line dump is unlabelled continuation lines, which supports 'lines != incidents'. Query: SELECT l.label, count(*) FROM logs g JOIN labels l ON l.dataset='bgl' AND l.line_id=g.line_id WHERE g.dataset='bgl' AND g.component='KERNEL' AND g.severity='FATAL' AND g.ts >= '2005-11-17 05:00' AND g.ts < '2005-11-17 06:00' GROUP BY 1 -> KERNSERV 48, KERNMC 1, KERNRTSP 1."
golden_check:
  - fact: "KERNEL FATAL lines 2005-11-17 05:00-06:00"
    golden_value: "245"
    my_value: "245"
    agrees: true
  - fact: "KERNEL FATAL lines in the previous 7 days"
    golden_value: "8044"
    my_value: "8044"
    agrees: true
notes: "The question asks whether the rate is unusual, so the answer depends on the baseline statistic. Against the mean it is ~5x higher; against the hourly distribution it is about the 97th percentile, with 5 higher hours. A strong answer gives both and then explains through content and scope: new hardware signatures on one node and one midplane, while the baseline peaks are fleet-wide job kills. The 04:00 hour just before (407 lines) holds the first two R36 dumps, so a window ending at 05:00 already includes the start of this episode. Queries were run after a full reload of the database that another session started; the golden values reproduced exactly."
