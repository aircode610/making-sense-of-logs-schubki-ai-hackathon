id: D-E05
role: engineer
dataset: bgl
question: "On 2005-11-17 BGL I/O nodes started logging 'ciod: Error reading message prefix ... Link has been severed'. What failed, where did it start, and what happened just before?"
answer_summary: "On 2005-11-17, 1008 APP FATAL lines 'ciod: Error reading message prefix on CioStream socket to 172.16.96.116:<port>, Link has been severed' came from 504 distinct I/O nodes (8 per midplane on 63 midplanes, racks R40-R77; only R73-M1 is missing). They arrived in two waves, 05:33:24-05:37:00 and 06:12-06:17:09, and each wave hit the same 504 nodes once. All of them lost their CioStream socket to the same peer, 172.16.96.116. The first line was at 05:33:24 on R77-M0-NC-I:J18-U11. The trigger was R73-M1, the one midplane missing from that set: at 05:32:47 all 16 of its node cards logged 'Power Good signal deactivated: R73-M1-Nx. A service action may be required.' (KERNEL FATAL, labelled KERNSERV). Within seconds, neighbouring compute nodes logged torus retransmission and input-pipe errors (R73-M0 at 05:32:52, R63-M0 at 05:33:06), and then every I/O node logged 'ciod: Received signal 15' (SIGTERM) followed by the severed link. This is the pattern of a job on the R40-R77 block being torn down. Wave 2 repeated the same sequence: service action 582 on R73-M1 (05:52-05:56), then Power Good lost on R73-M1 again at 06:12:22, then the same torus errors, SIGTERM and severed links. The severed lines are a symptom of the partition being killed, not a separate failure on each I/O node. The logs do not show why R73-M1 lost power."
findings:
  - fact: "1008 'Link has been severed' lines on 2005-11-17 (pattern 968, APP FATAL, all labelled APPSEV) from 504 distinct I/O nodes on 63 midplanes. There were two waves of 504 lines, and each wave hit all 504 nodes once. Every line names the same socket peer, 172.16.96.116. These are lines, not 1008 incidents: one event (two waves) on one partition."
    sql: "SELECT CASE WHEN ts < '2005-11-17 06:00' THEN 'wave1' ELSE 'wave2' END w, count(*), count(distinct node), count(distinct substr(node,1,6)), list_distinct(regexp_extract_all(string_agg(body,' '), 'to (\\d+\\.\\d+\\.\\d+\\.\\d+):', 1)) FROM logs WHERE dataset='bgl' AND pattern_id=968 AND ts >= '2005-11-17' AND ts < '2005-11-18' GROUP BY 1"
    result: "wave1|504|504|63|{172.16.96.116} ; wave2|504|504|63|{172.16.96.116}  (wave1 05:33:24-05:37:00, wave2 06:12-06:17:09; all nodes are I-cards, e.g. R77-M0-NC-I:J18-U11)"
    importance: must
  - fact: "Where it started: the first severed line is 2005-11-17 05:33:24.62, line 4215995, on R77-M0-NC-I:J18-U11. That is also the first occurrence of this message anywhere in the corpus. Line 4215994, just before it on the same node, is 'ciod: Received signal 15, code=0, errno=0'. The affected midplanes are R40-M0 through R77-M1 except R73-M1: 63 of the 64 midplanes in racks R40-R77, 8 I/O nodes each."
    sql: "SELECT line_id, strftime(ts,'%Y-%m-%d %H:%M:%S.%f'), component, severity, node, left(body,150) FROM logs WHERE dataset='bgl' AND ts >= '2005-11-16 12:00' AND ts < '2005-11-17 05:33:24.7' ORDER BY ts DESC LIMIT 25"
    result: "4215995|05:33:24|APP|FATAL|R77-M0-NC-I:J18-U11|ciod: Error reading message prefix on CioStream socket to 172.16.96.116:43572, Link has been severed ; 4215994|05:33:24|KERNEL|INFO|R77-M0-NC-I:J18-U11|ciod: Received signal 15, code=0, errno=0, address=0x000001b0 ; 4215971-4215993 R63-M0-N5/ND compute cards: torus sender x- retransmission errors / receiver x- input pipe errors"
    importance: must
  - fact: "Immediate precursor: at 05:32:47, 16 KERNEL FATAL lines 'Power Good signal deactivated: R73-M1-N<x>. A service action may be required.' (labelled KERNSERV; the node column is NULL and the location is only in the body). That covers all 16 node cards of R73-M1, the one midplane in R40-R77 whose I/O nodes did not report a severed link. Wave 2 has the same precursor at 06:12:22 (16 lines). Later lines: R73-M1-N0/N10 again at 05:41-05:42 and 06:47."
    sql: "SELECT line_id, strftime(ts,'%H:%M:%S'), node, location, body FROM logs WHERE dataset='bgl' AND pattern_id IN (963,975) AND ts >= '2005-11-17 05:00' AND ts < '2005-11-17 06:30' ORDER BY ts LIMIT 6"
    result: "4215732|05:32:47|||Power Good signal deactivated: R73-M1-N5. ... ; 4215737|05:32:47|||Power Good signal deactivated: R73-M1-N0. A service action may be required.  (per-minute: 05:32 16 lines, 06:12 16 lines)"
    importance: must
  - fact: "The sequence within each wave runs as follows. R73-M1 loses Power Good (05:32:47). Torus errors follow on the neighbouring compute midplanes: 64 nodes on R73-M0 from 05:32:52 (z+/y+ retransmissions, about 17M errors) and 64 nodes on R63-M0 from 05:33:06 (x-). Then 'ciod: Received signal 15' (SIGTERM) on the 504 I/O nodes (05:33-05:37), and their 'Link has been severed' lines. Wave 2: 06:12:22 Power Good lost, 06:12:28 onwards torus y+/x- errors (R73-M0, R63-M0), 06:12-06:17 SIGTERM and severed on the same 504 nodes."
    sql: "SELECT strftime(ts,'%H:%M') m, pattern_id, count(*), count(distinct node), min(substr(node,1,6)), max(substr(node,1,6)), count(distinct substr(node,1,6)) FROM logs WHERE dataset='bgl' AND pattern_id IN (958,959,960,963,975,964,967) AND ts >= '2005-11-17 05:00' AND ts < '2005-11-17 06:30' GROUP BY 1,2 ORDER BY 1,2"
    result: "05:32|963|16 ; 05:32|964|1 (R73-M0) ; 05:33|960|94 nodes R40-R77 ; 05:33|967|64 (R63-M0) ; 05:34-05:37|960|98+10+158+144 ; 05:35-05:36|964|63 (R73-M0) ; 06:12|963|16 ; 06:12|967|48 (R63-M0) ; 06:12-06:17|960|504 total. Signal 15 lines 05:30-24:00 = 1008 on the 504 nodes; for 603 of the 1008 severed lines a SIGTERM on the same node is within 5 s, and all are within 258 s."
    importance: must
  - fact: "Service actions by root bracket the event, but a causal link is not proven. 05:31:18: PrepareForService on midplane R36-M1 (service action 581, 16 node cards shut down 05:31:36-05:33:03, EndServiceAction 05:33:38). R73-M1 lost power 89 s later, at 05:32:47. Then 05:52:20-05:56:10: service action 582 on R73-M1 itself (PrepareForService, 16 node cards shut down, EndServiceAction restarting them), followed by DISCOVERY 'Node card is not fully functional' / 'Can not get assembly information' on 15 node cards (05:57-05:59). About 16 minutes later, at 06:12:22, R73-M1 lost Power Good again and wave 2 started."
    sql: "SELECT line_id, strftime(ts,'%H:%M:%S'), node, body FROM logs WHERE dataset='bgl' AND pattern_id IN (961,969,970) AND ts >= '2005-11-17 05:00' AND ts < '2005-11-17 06:30' ORDER BY ts"
    result: "4215718|05:31:18|R36-M1|PrepareForService ... (mLctn(R36-M1) ...) by root ; 4216085|05:33:38|R36-M1|EndServiceAction 581 performed upon R36-M1-N by root ; 4217639|05:52:20|R73-M1|PrepareForService ... (mLctn(R73-M1) ...) by root ; 4217657|05:56:10|R73-M1|EndServiceAction 582 performed upon R73-M1-N by root"
    importance: should
  - fact: "A separate, earlier failure on a different set of nodes: 05:02 and 05:12 'ciod: Error loading /bgl/apps/followup/SPaSM_static/SPaSM.460-1115 (then HPL/xhpl.460): invalid or missing program image, Permission denied' on 64 I/O nodes of 8 midplanes (R60-R65), then SIGTERM on those 64 at 05:14. A CMCS SystemController restart happened at 05:09. These are job-launch failures, not the trigger of the severed links."
    sql: "SELECT l.pattern_id, l.component, l.severity, count(*), count(distinct l.node), strftime(min(l.ts),'%H:%M:%S'), strftime(max(l.ts),'%H:%M:%S'), left(min(l.body),120) FROM logs l WHERE l.dataset='bgl' AND l.ts >= '2005-11-17 05:00' AND l.ts < '2005-11-17 05:45' GROUP BY 1,2,3 HAVING count(*)>3 OR l.component NOT IN ('KERNEL') ORDER BY 6"
    result: "958|APP|FATAL|64|64|05:02:15|05:02:24|ciod: Error loading /bgl/apps/followup/SPaSM_static/SPaSM.460-1115: invalid or missing program image, Permission denied ; 959|APP|FATAL|64|64|05:12:38|05:12:48|... HPL/xhpl.460 ... ; 960 signal 15 64 nodes R60-M0..R65-M1 at 05:14"
    importance: should
  - fact: "Recurrence and baseline: 2005-11-17 is the first day this message ever appears. It then recurs on 34 days up to 2006-01-03, 26,546 lines in total and up to 1024 distinct I/O nodes on a day (e.g. 11-24, 11-25, 12-12), so 11-17 is the onset of a recurring pattern, not a one-off. The next day (11-18 05:34-05:37) it hit 203 nodes."
    sql: "SELECT strftime(l.ts,'%Y-%m-%d') d, count(*), count(distinct l.node) FROM logs l JOIN patterns p ON p.dataset=l.dataset AND p.pattern_id=l.pattern_id WHERE l.dataset='bgl' AND p.template = 'ciod: Error reading message prefix on CioStream socket to <N>, Link has been severed' GROUP BY 1 ORDER BY 1"
    result: "2005-11-17|1008|504 ; 2005-11-18|203|203 ; ... 2005-11-24|2047|1023 ; 2005-11-25|2045|1024 ; ... 2006-01-03|130|130  (overall min 2005-11-17 05:33:24, max 2006-01-03 11:56:38, 26546 lines, 1024 nodes)"
    importance: nice
  - fact: "Aftermath: R73-M1 lost Power Good again at 06:47. At 08:06:17 'Kill job 49628 timed out. Block freed.' and an 'idoproxy communication failure: socket closed', then at 08:07 BGLMaster, idoproxydb and mmcs_db_server were restarted ('ciodb has been restarted'). At 08:08 a PrepareForService on R36-M1-N0 followed."
    sql: "SELECT l.pattern_id, l.component, l.severity, count(*), count(distinct l.node), strftime(min(l.ts),'%H:%M:%S'), strftime(max(l.ts),'%H:%M:%S'), left(min(l.body),100) FROM logs l WHERE l.dataset='bgl' AND l.ts >= '2005-11-17 06:17:10' AND l.ts < '2005-11-17 09:00' GROUP BY 1,2,3 ORDER BY 6 LIMIT 25"
    result: "963|KERNEL|FATAL|9|06:47:21 Power Good signal deactivated: R73-M1-N0 ; 261|KERNEL|FATAL|08:06:17|Kill job 49628 timed out. Block freed. ; 892|08:06:18|idoproxy communication failure: socket closed ; 455/445/596/24 08:07:48-49 BGLMaster / idoproxydb / mmcs_db_server started, ciodb restarted"
    importance: nice
must_conclude:
  - "What failed: ciod on the I/O nodes lost its CioStream connection (to 172.16.96.116). This is how a job on the R40-R77 partition being killed shows up (SIGTERM, signal 15, on every I/O node). It is not 1008 independent I/O node failures."
  - "Where: 504 I/O nodes, 8 on each of 63 midplanes R40-M0..R77-M1 (all except R73-M1). First line 05:33:24 on R77-M0-NC-I:J18-U11."
  - "Just before: at 05:32:47 all 16 node cards of R73-M1 logged 'Power Good signal deactivated' (KERNEL FATAL), and neighbouring compute midplanes (R73-M0, R63-M0) logged torus retransmission errors. Then came SIGTERM and the severed links."
  - "There were two waves (05:33-05:37 and 06:12-06:17), each preceded by an R73-M1 Power Good loss. A service action on R73-M1 (05:52-05:56) fell between them and did not prevent the second wave."
  - "Lines vs incidents: 1008 lines = 504 nodes x 2 waves = one partition-level event that happened twice."
  - "Next step: inspect R73-M1's power / node cards (service action, hardware) and check the job/partition records for the R40-R77 block. The logs do not show why the power dropped."
traps:
  - "Reporting 1008 incidents or 1008 failed nodes. It is 504 distinct I/O nodes, each hit once in each of two waves."
  - "Blaming the I/O nodes, ciod or the network peer 172.16.96.116 as the root cause. The severed link follows SIGTERM and the R73-M1 power loss."
  - "Blaming the torus retransmission errors (KERNEL INFO, 'detected and corrected') on R63-M0 / R73-M0 as the cause. They come seconds after the R73-M1 power loss and are a consequence of it."
  - "Blaming the 05:02 / 05:12 'Error loading ... Permission denied' program-image failures. They are on a different set of 64 I/O nodes (R60-R65) and are job-launch errors."
  - "Stating as fact that root's 05:31 service action on R36-M1 caused R73-M1 to lose power. The timing (89 s) is suggestive, but the logs do not establish it."
  - "Treating the 06:12 wave as duplicated log lines. Its socket ports differ (0 of 504 bodies identical), so it is a real second event."
  - "Missing the precursor because the Power Good lines have NULL node/location. R73-M1 appears only in the message body, so a node-filtered context search shows nothing."
  - "Treating 11-17 as isolated. The message recurs on 34 days through 2006-01-03."
not_established:
  - "Why R73-M1 lost Power Good (power module / bulk power failure, or a service-action side effect). A 'power module status fault detected on node card' appears only at 08:00:32, and nothing links it to R73-M1."
  - "Whether root's service action 581 on R36-M1 (05:31) had anything to do with R73-M1 losing power at 05:32:47."
  - "Which job or user was running on the R40-R77 block, or how much work was lost. Job 49628 'Kill job timed out' at 08:06 is not shown to be the same job."
  - "What 172.16.96.116 is (presumably a front-end / service node the ciod streams connect to). The logs give only the IP."
  - "Any impact on users, money or downtime."
labels_used: "All 1008 severed lines carry the label APPSEV, and the R73-M1 'Power Good signal deactivated' lines (patterns 963/975) carry KERNSERV. That confirms both as alert events. The SIGTERM, torus error, service-action and DISCOVERY lines in the window are unlabelled ('-'), which fits their role as context and side effects, not alerts."
golden_check:
  - fact: "Link has been severed (ciod prefix) lines on 2005-11-17"
    golden_value: "1008"
    my_value: "1008 (504 distinct I/O nodes x 2 waves)"
    agrees: true
  - fact: "first occurrence"
    golden_value: "2005-11-17 05:33"
    my_value: "2005-11-17 05:33:24 (line 4215995, R77-M0-NC-I:J18-U11)"
    agrees: true
notes: "The question's 'what happened just before' has a layered answer: on the same node, ciod received SIGTERM (signal 15) a moment before. System-wide, R73-M1 lost Power Good on all 16 node cards about 37 s before the first severed line, and torus errors followed on adjacent midplanes. A good answer names the R73-M1 power loss as the key precursor and ties it to the one midplane missing from the affected set. pattern_id 968 = the severed template, 960 = signal 15, 963/975 = Power Good deactivated, 961/962/969/970 = service actions (ids as loaded at the time of writing; the golden SQL joins on the template text instead). The database was being reloaded by another process during this investigation, and all results were taken after BGL was fully reloaded (4,747,963 lines, 348,460 labels). Not-yet-reloaded datasets do not matter for this question."
