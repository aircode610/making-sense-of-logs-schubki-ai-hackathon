id: D-E02
role: engineer
dataset: bgl
question: "Find 'data TLB error interrupt' in June 2005 (2005-06-01 to 2005-07-01). Where and when did it start, and how widespread was it?"
answer_summary: "June 2005 has 152,659 'data TLB error interrupt' lines (all KERNEL FATAL) on 467 distinct nodes in 13 racks, but they form two very different episodes. Episode 1 starts 2005-06-05 00:08:13 on R20-M0-N2-C:J10-U11 (line 17742) and runs in waves until 08:32: 477 lines on 466 nodes across 13 racks (R20-R25, R30-R37), about one line per node, and every one of those 466 nodes also logged 'generating core.N' that day, the signature of a job-wide crash with core dumps. Episode 2 is a single node, R30-M0-N9-C:J16-U01, on 2005-06-11 17:17:44-23:39:32: 152,182 lines (99.7% of the month's count, about 24k per hour), and it begins right after one 'machine check interrupt (bit=0x10): L2 DCU read error' on that node (line 222715). So the line count is dominated by one repeating node; the widespread part is episode 1, which has few lines but many nodes. There are no occurrences after June 11 within June. The logs do not show the root cause of either episode."
findings:
  - fact: "152,659 matching lines in June 2005, all KERNEL/FATAL, on 467 distinct nodes in 13 racks / 25 midplanes; first 2005-06-05 00:08:13, last 2005-06-11 23:39:32"
    sql: "SELECT count(*), count(DISTINCT node), strftime(min(ts),'%Y-%m-%d %H:%M:%S'), strftime(max(ts),'%Y-%m-%d %H:%M:%S'), count(DISTINCT substr(node,1,3)), count(DISTINCT substr(node,1,6)) FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('\"data TLB error interrupt\"') AND ts >= '2005-06-01' AND ts < '2005-07-01'"
    result: "152659|467|2005-06-05 00:08:13|2005-06-11 23:39:32|13|25 (component/severity: KERNEL|FATAL|152659)"
    importance: must
  - fact: "Two days only: June 5 = 477 lines on 466 nodes; June 11 = 152,182 lines on 1 node"
    sql: "SELECT strftime(ts,'%Y-%m-%d'), count(*), count(DISTINCT node) FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('\"data TLB error interrupt\"') AND ts >= '2005-06-01' AND ts < '2005-07-01' GROUP BY 1 ORDER BY 1"
    result: "2005-06-05|477|466 ; 2005-06-11|152182|1"
    importance: must
  - fact: "The June 11 storm is a single node, R30-M0-N9-C:J16-U01, 17:17:44 to 23:39:32 (lines 222716-375317), about 18k-24k lines per hour; it is 99.7% of the month's lines"
    sql: "SELECT node, count(*), strftime(min(ts),'%Y-%m-%d %H:%M:%S'), strftime(max(ts),'%Y-%m-%d %H:%M:%S'), min(line_id), max(line_id) FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('\"data TLB error interrupt\"') AND ts >= '2005-06-11' AND ts < '2005-07-01' GROUP BY 1"
    result: "R30-M0-N9-C:J16-U01|152182|2005-06-11 17:17:44|2005-06-11 23:39:32|222716|375317 (hourly: 17h 17626, 18h 24321, 19h 22891, 20h 23848, 21h 23847, 22h 23675, 23h 15974)"
    importance: must
  - fact: "Where it started: first line 2005-06-05 00:08:13.41 on R20-M0-N2-C:J10-U11 (line 17742); within seconds it appeared on other R20 and R21 nodes"
    sql: "SELECT line_id, strftime(ts,'%Y-%m-%d %H:%M:%S.%f'), node FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('\"data TLB error interrupt\"') AND ts >= '2005-06-01' AND ts < '2005-07-01' ORDER BY ts, line_id LIMIT 15"
    result: "17742|00:08:13.41|R20-M0-N2-C:J10-U11 ; 17745|R20-M0-N2-C:J14-U01 ; 17758|R20-M0-ND-C:J13-U11 ; ... 18169|00:08:25|R21-M1-N1-C:J02-U01"
    importance: must
  - fact: "Episode 1 (June 5) is fleet-wide: 13 racks, about one line per node (max 3 per node), in waves 00:08-01:10 (R20/R21/R24/R25), 04:20-07:10 (R22) and 07:40-08:32 (R30-R37)"
    sql: "SELECT substr(node,1,3), count(*), count(DISTINCT node), strftime(min(ts),'%m-%d %H:%M') FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('\"data TLB error interrupt\"') AND ts >= '2005-06-01' AND ts < '2005-07-01' GROUP BY 1 ORDER BY 2 DESC"
    result: "R30 152199/18 (17 nodes with 1 line each on Jun 5, plus the hot node); R21 74/74 00:08; R24 63/62 00:08; R25 62/60 00:09; R20 55/55 00:08; R22 35/30 04:22; R35 29/28, R32 29/29, R33 28/28, R31 27/26, R36 24/23, R37 20/20, R34 14/14 all from 07:42"
    importance: should
  - fact: "Sequence on June 5: a mass 'generating core.N' core dump (16,130 lines on 4,096 nodes between 23:50 and 01:30, starting 00:08:05) comes just before and alongside the first DTLB lines, and all 466 June-5 DTLB nodes also logged 'generating core' that day, so these are crashing job processes, not 466 separate hardware faults"
    sql: "WITH d AS (SELECT DISTINCT node FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('\"data TLB error interrupt\"') AND ts >= '2005-06-05' AND ts < '2005-06-06'), c AS (SELECT DISTINCT node FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('\"generating core\"') AND ts >= '2005-06-05' AND ts < '2005-06-06') SELECT (SELECT count(*) FROM c), (SELECT count(*) FROM d), (SELECT count(*) FROM d WHERE node IN (SELECT node FROM c))"
    result: "22149|466|466 (template window 2005-06-04 23:50 to 06-05 01:30: 'generating core.<N>' 16130 lines / 4096 nodes, first 00:08:05; DTLB 254 / 251, first 00:08:13)"
    importance: should
  - fact: "Sequence on June 11: the storm node's only earlier line that day is 'machine check interrupt (bit=0x10): L2 DCU read error' (line 222715, 17:17:44), in the same second as the first DTLB line. The node is then silent until 2005-06-13 04:47:27, when it logs the L2 DCU machine check again (no DTLB lines follow)"
    sql: "SELECT line_id, strftime(ts,'%m-%d %H:%M:%S'), component, severity, left(body,100) FROM logs WHERE dataset='bgl' AND node='R30-M0-N9-C:J16-U01' AND ts >= '2005-06-11 00:00' AND ts < '2005-06-11 17:17:45' ORDER BY ts DESC, line_id DESC LIMIT 12"
    result: "222716|06-11 17:17:44|KERNEL|FATAL|data TLB error interrupt ; 222715|06-11 17:17:44|KERNEL|FATAL|machine check interrupt (bit=0x10): L2 DCU read error (after the storm: 378795|06-13 04:47:27 machine check ... L2 DCU read error; 378796 instruction address: 0x0035bc24). 'L2 DCU read error' in June: 2 lines, 1 node"
    importance: should
  - fact: "Labels confirm every matching line is a Loghub alert of category KERNDTLB, and June has no other KERNDTLB lines; the signal recurs much more weakly later (75 lines on 75 nodes, 2005-07-15 to 2005-11-28)"
    sql: "SELECT l.label, count(*), count(DISTINCT g.node) FROM logs g JOIN labels l ON l.dataset='bgl' AND l.line_id=g.line_id WHERE g.dataset='bgl' AND g.body @@ websearch_to_tsquery('\"data TLB error interrupt\"') AND g.ts >= '2005-06-01' AND g.ts < '2005-07-01' GROUP BY 1"
    result: "KERNDTLB|152659|467 ; all KERNDTLB in June = 152659 ; after June: 2005-07-15 14:54 to 2005-11-28 10:01, 75 lines, 75 nodes"
    importance: nice
must_conclude:
  - "Started 2005-06-05 00:08:13 on R20-M0-N2-C:J10-U11 (R20/R21 first), with the first occurrence on June 5, not June 1"
  - "Gives 152,659 lines on 467 distinct nodes and says that lines are not incidents: there are two episodes, June 5 (about 466 nodes, about one line each) and June 11 (one node, 152,182 lines)"
  - "Names R30-M0-N9-C:J16-U01 as the node behind almost all the volume (June 11, 17:17-23:39)"
  - "Widespread means June 5 (13 racks); the big count is one repeating node, which needs its own hardware check (it logged an L2 DCU read machine check just before the storm)"
  - "Next step: inspect or replace R30-M0-N9-C:J16-U01 (owner node-platform, the team for KERNEL) and look at what job crashed on June 5 (core dumps)"
traps:
  - "Saying 152,659 errors/incidents across 467 nodes means a fleet-wide hardware failure: 99.7% of lines are one node"
  - "Saying R30 is the worst rack because it has 152,199 lines: that is one node, and R30 had only 17 other nodes with 1 line each"
  - "Saying it started June 1 or June 3 (window start / dataset start); the first DTLB line is June 5 00:08"
  - "Reporting only the June 11 storm and missing the multi-rack June 5 episode, or the reverse"
  - "Saying the storm continued for days: it stops at 23:39:32 on June 11"
  - "Claiming the machine check or the job crash proves the root cause; that is temporal adjacency only"
not_established:
  - "Root cause of either episode (software bug in the job vs. hardware); the logs show only adjacency to core dumps (June 5) and an L2 DCU machine check (June 11)"
  - "Which job/user ran on the June 5 partition, and whether the June 5 nodes were one job"
  - "Whether R30-M0-N9-C:J16-U01 was repaired or replaced, or why the storm stopped at 23:39"
  - "Any downtime or user impact"
labels_used: "labels (BGL alert category per line): all 152,659 matching June lines carry KERNDTLB and there are no other KERNDTLB lines in June, so the phrase search is exactly the labelled alert set (precision and recall 1.0 for this category in the window)."
golden_check:
  - fact: "data TLB error interrupt lines in June 2005"
    golden_value: "152659"
    my_value: "152659"
    agrees: true
  - fact: "distinct nodes in June 2005"
    golden_value: "467"
    my_value: "467"
    agrees: true
  - fact: "first occurrence"
    golden_value: "2005-06-05 00:08"
    my_value: "2005-06-05 00:08 (00:08:13.41, line 17742, R20-M0-N2-C:J10-U11)"
    agrees: true
notes: "'How widespread' has two honest answers: by nodes, wide (467 nodes, 13 racks, almost all on June 5); by lines, concentrated (one node is 99.7%). A good answer gives both. The BGL dataset begins 2005-06-03, so the June window effectively covers June 3-30. During construction the DB was reloaded by another process; all numbers were re-verified after the reload (same values and line_ids). Ownership: KERNEL -> node-platform (data/ownership.csv, fictional)."
