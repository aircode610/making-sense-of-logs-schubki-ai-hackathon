id: D-L02
role: lead
dataset: bgl
question: "How did the 'machine check interrupt' problem trend week over week in October 2005 (2005-10-01 to 2005-11-01), and which team owns it?"
answer_summary: "In October 2005 the exact KERNEL FATAL template 'machine check interrupt' (pattern 33) logged 37 lines on 34 distinct compute nodes. They fall in 34 bursts, so it is about 34 separate occurrences and not a few big storms. By week, using ISO weeks clipped to October: Oct 1-2 had 3, Oct 3-9 had 15 (the peak), Oct 10-16 had 7 (5 nodes), Oct 17-23 had 4, Oct 24-30 had 6 and Oct 31 had 2. So the month opened at its peak, which carried on from a late-September rise (18 in the week of Sep 19), then fell to 4-7 a week. At month level October (37) was flat against September (38), and November then fell to 19. The problem is spread across the fleet: 34 nodes on 31 midplanes in 25 racks, all compute (C) cards, and only 2 nodes repeat (R51-M0-N8-C:J13-U11 three times, R02-M0-N4-C:J04-U11 twice). The owner is node-platform (component KERNEL in the ownership table). The lead should have node-platform check the two repeat nodes first and track whether the decline holds. The logs do not show the hardware root cause."
findings:
  - fact: "October 2005 totals for the exact template 'machine check interrupt': 37 lines, 34 distinct nodes, 31 midplanes. Every line is FATAL with the Loghub alert label KERNMC."
    sql: "SELECT count(*), count(DISTINCT node), count(DISTINCT substr(node,1,6)) FROM logs WHERE dataset='bgl' AND pattern_id=33 AND ts>='2005-10-01' AND ts<'2005-11-01'  -- pattern 33 = template 'machine check interrupt', KERNEL"
    result: "37|34|31  (labels join: FATAL|KERNMC|37)"
    importance: must
  - fact: "Week-over-week counts (ISO weeks starting Monday, clipped to October): Oct 1-2 had 3 lines / 3 nodes; Oct 3-9 had 15 / 15 (peak); Oct 10-16 had 7 / 5; Oct 17-23 had 4 / 4; Oct 24-30 had 6 / 6; Oct 31 had 2 / 2. The trend falls from an early-October peak to a low plateau."
    sql: "SELECT date_trunc('week', ts) w, count(*), count(DISTINCT node), min(ts), max(ts) FROM logs WHERE dataset='bgl' AND pattern_id=33 AND ts>='2005-10-01' AND ts<'2005-11-01' GROUP BY 1 ORDER BY 1"
    result: "2005-09-26|3|3 (Oct 1-2 only); 2005-10-03|15|15; 2005-10-10|7|5; 2005-10-17|4|4; 2005-10-24|6|6; 2005-10-31|2|2 (Oct 31 only)"
    importance: must
  - fact: "Owner: component KERNEL belongs to team node-platform ('Compute-node kernel (memory/cache parity, torus, CIOD, interrupts)'). Every machine check line is component KERNEL."
    sql: "SELECT * FROM ownership WHERE dataset='bgl' AND component='KERNEL'"
    result: "bgl|KERNEL|node-platform|Compute-node kernel (memory/cache parity, torus, CIOD, interrupts)"
    importance: must
  - fact: "Context: the October peak continues a late-September rise. Weekly counts were 18 (week of Sep 19) and 10 (week of Sep 26), then 15 (Oct 3), 7, 4, 6. By month: Jun 13, Jul 23, Aug 28, Sep 38, Oct 37, Nov 19, Dec 3. October matched September, and the decline shows in November."
    sql: "SELECT date_trunc('month', ts), count(*), count(DISTINCT node) FROM logs WHERE dataset='bgl' AND pattern_id=33 GROUP BY 1 ORDER BY 1"
    result: "Jun 13|12; Jul 23|19; Aug 28|27; Sep 38|38; Oct 37|34; Nov 19|19; Dec 3|3"
    importance: should
  - fact: "Scope is fleet-wide and scattered, not one bad node. 34 nodes in 25 racks, no compute (I/O) cards affected (all C cards), and no rack has more than 3 lines. Only 2 nodes repeat: R51-M0-N8-C:J13-U11 (3 lines, Oct 5 to Oct 13) and R02-M0-N4-C:J04-U11 (2 lines, both on Oct 16)."
    sql: "SELECT node, count(*), min(ts), max(ts) FROM logs WHERE dataset='bgl' AND pattern_id=33 AND ts>='2005-10-01' AND ts<'2005-11-01' GROUP BY 1 HAVING count(*)>1"
    result: "R51-M0-N8-C:J13-U11|3|2005-10-05 12:20:56|2005-10-13 16:37:04 ; R02-M0-N4-C:J04-U11|2|2005-10-16 15:03:54|2005-10-16 16:09:35 ; racks: 25 distinct, top R23/R33/R51 with 3 each; I/O-card lines: 0"
    importance: should
  - fact: "Lines are not incidents. Each 'machine check interrupt' line opens a register dump of about 10 FATAL KERNEL lines from the same node over about 1 minute (instruction address, machine check status register, plb/tlb/parity bits). So 'machine check' full-text matches (235 lines in October) overstate events by roughly 6x."
    sql: "SELECT ts, pattern_id, severity, left(body,90) FROM logs WHERE dataset='bgl' AND node='R51-M0-N8-C:J13-U11' AND ts BETWEEN '2005-10-05 12:20:50' AND '2005-10-05 12:40:00' ORDER BY ts LIMIT 40 ; SELECT count(*) FROM logs WHERE dataset='bgl' AND ts>='2005-10-01' AND ts<'2005-11-01' AND body @@ websearch_to_tsquery('\"machine check\"')"
    result: "12:20:56 machine check interrupt (33); 12:20:57 instruction address; machine check status register: 0x82000000; summary...1; ... d-cache search parity error...1 (12:21:25); d-cache flush parity error (12:21:50). FTS 'machine check' in Oct = 235 lines"
    importance: should
  - fact: "Closely related variants carry the same KERNMC label: 'machine check interrupt (bit=..): L2 dcache unit data parity error' (pattern 86, 14 lines / 13 nodes) and '... L2 major internal error' (pattern 93, 10 lines / 8 nodes). Together with pattern 33 that makes 61 lines on 54 nodes in October. KERNMC labels in October total 65 lines (33: 37, 86: 14, 93: 10, 132 'DDR machine check register': 4)."
    sql: "SELECT l.pattern_id, count(*) FROM labels b JOIN logs l ON l.dataset='bgl' AND l.line_id=b.line_id WHERE b.dataset='bgl' AND l.ts>='2005-10-01' AND l.ts<'2005-11-01' AND b.label='KERNMC' GROUP BY 1 ; SELECT count(*), count(DISTINCT node) FROM logs WHERE dataset='bgl' AND pattern_id IN (33,86,93) AND ts>='2005-10-01' AND ts<'2005-11-01'"
    result: "33|37, 86|14, 93|10, 132|4 (total 65) ; 33+86+93 = 61 lines | 54 nodes"
    importance: nice
must_conclude:
  - "The owner is node-platform (component KERNEL)."
  - "Give a week-by-week series for October: it peaks in the first full week (Oct 3-9, about 15) and then falls to roughly 4-7 per week."
  - "Describe it as about 34 nodes / 34 separate occurrences (37 lines) across the fleet, not one node or one storm."
  - "Recommend that node-platform check the repeat nodes first (R51-M0-N8-C:J13-U11, R02-M0-N4-C:J04-U11) and keep watching the trend. The month total is flat against September, so a few quiet weeks are not proof that it is resolved."
traps:
  - "Counting every 'machine check' full-text match (about 235 lines in October), or all FATAL KERNEL register-dump lines, as machine check incidents. Each event writes about 10 dump lines."
  - "Calling this one failing node or one big burst. It is 34 nodes on 31 midplanes in 25 racks, and only 2 nodes repeat."
  - "Using weeks that are not clipped to October (e.g. counting the whole week of Sep 26, which holds 10 lines but only 3 in October, or the whole week of Oct 31, which runs to Nov 5 with 8 lines)."
  - "Saying it 'grew' or 'spiked' in October. October (37) is flat against September (38), and within October the trend falls after the first week."
  - "Assigning ownership to cluster-control (MMCS/MONITOR) or hpc-workloads (APP) because jobs or midplanes are involved. The lines are KERNEL, which node-platform owns."
  - "Saying the 34 bursts mean 34 multi-line storms. The bursts are mostly single lines (34 bursts for 37 lines)."
not_established:
  - "The physical root cause (failing cards, environment, firmware) and whether the affected cards were replaced."
  - "Whether the drop after Oct 9 came from a fix, from fewer jobs running, or from chance. The counts are small, so the weekly changes of 4-7 are within noise."
  - "Impact on user jobs, downtime or cost. The logs show kernel FATAL events, not business impact."
  - "Whether the separate variant patterns (L2 dcache parity, major internal error) share a cause with the plain 'machine check interrupt'."
labels_used: "All 37 October pattern-33 lines carry the Loghub alert label KERNMC (all FATAL). That confirms they are true alerts. KERNMC in October covers 65 lines in 4 patterns (33, 86, 93, 132). The register-dump lines that follow each event are not labelled, which confirms they should not be counted as separate alerts."
golden_check:
  - fact: "bursts of 'machine check interrupt' started in October 2005"
    golden_value: "34"
    my_value: "34"
    agrees: true
  - fact: "distinct nodes with 'machine check interrupt' in October 2005"
    golden_value: "34"
    my_value: "34 (37 lines)"
    agrees: true
notes: "'The machine check interrupt problem' is read as the exact template (pattern 33), as in the golden SQL. An answer that also includes the '(bit=..)' variants (61 lines / 54 nodes) is acceptable if it says so explicitly, and should still find the early-October peak and node-platform ownership. Week boundaries are ambiguous: with 7-day blocks from Oct 1 the counts are 11, 12, 3, 5, 6 (Oct 1-7, 8-14, 15-21, 22-28, 29-31). Either convention is fine if stated, because both show the peak early in the month and lower counts later. The golden 'bursts' fact matches, but bursts here are nearly always single lines."
