id: D-E04
role: engineer
dataset: openstack
question: "Why did nova-api return HTTP 503 errors, when did it happen, and what happened around those requests?"
answer_summary: "nova-api returned 503 exactly twice in the corpus, both on the same call (GET /v2/54fadb412c4e40cdbaed9335e4c35a9e/servers/detail from 10.11.10.1), at 2017-05-16 06:25:02.870 (req-1cc7d50c-...) and 2017-05-17 06:25:03.049 (req-abcdb287-...). That is the same time of day, 24 hours apart. Each one comes right after the same 3-line sequence in the same request, about 3 ms earlier: ERROR 'Bad response code while validating token: 503', WARNING 'Identity response: <!DOCTYPE HTML ...', CRITICAL 'Unable to validate token: Failed to fetch token data from identity server'. So nova-api's auth middleware (keystonemiddleware.auth_token in the raw log) got a 503 from the identity service (Keystone) when it tried to validate the token, and failed fast (8-10 ms against the usual ~0.25 s). Nova itself was not failing. Around the errors the tenant was polling servers/detail about every 1.3 s with 200s, and the request just before each 503 succeeded. These are 2 failed requests, one per day, not an outage. These are the only ERROR/CRITICAL nova-api lines in the corpus. Keystone's own logs are not in the corpus, so why Keystone returned 503 is not established. The daily 06:25 timing matches the nova-api log rotation in the raw files, which points to a scheduled daily job (e.g. cron.daily/logrotate reloading the identity web server), but that is a hypothesis."
findings:
  - fact: "Exactly 2 nova-api lines carry HTTP status 503, both GET /v2/54fadb.../servers/detail from 10.11.10.1, one per day at about 06:25 (24 h apart). Both failed fast (8.05 ms and 10.19 ms)."
    sql: "SELECT line_id, ts, component, request_id, status, duration_ms, body FROM logs WHERE dataset='openstack' AND status=503 ORDER BY ts"
    result: "70746|2017-05-16 06:25:02.87|nova-api|req-1cc7d50c-25a2-46b0-a668-9c00f589160c|503|8.0531|10.11.10.1 \"GET /v2/54fadb412c4e40cdbaed9335e4c35a9e/servers/detail HTTP/1.1\" status: 503 len: 323 time: 0.0080531 ; 194065|2017-05-17 06:25:03.049|nova-api|req-abcdb287-429c-40a5-8e79-d490d4fb7410|503|10.186|... status: 503 len: 323 time: 0.0101860"
    importance: must
  - fact: "Cause in the logs: in the same request, about 3 ms before each 503, token validation against the identity service failed (ERROR 'Bad response code while validating token: 503' -> WARNING 'Identity response: <!DOCTYPE HTML...' -> CRITICAL 'Unable to validate token: Failed to fetch token data from identity server'). The 503 came from Keystone, and nova-api passed it on to the client."
    sql: "SELECT line_id, ts, severity, request_id, left(body,120) FROM logs WHERE dataset='openstack' AND request_id IN ('req-1cc7d50c-25a2-46b0-a668-9c00f589160c','req-abcdb287-429c-40a5-8e79-d490d4fb7410') ORDER BY ts"
    result: "70742 06:25:01.857 INFO status: 200 | 70743 06:25:02.867 ERROR Bad response code while validating token: 503 | 70744 06:25:02.868 WARNING Identity response: <!DOCTYPE HTML PUBLIC ... | 70745 06:25:02.869 CRITICAL Unable to validate token: Failed to fetch token data from identity server | 70746 06:25:02.87 INFO status: 503 ; same 5-line shape for req-abcdb287 at 2017-05-17 06:25:02.033-06:25:03.049 (lines 194061-194065)"
    importance: must
  - fact: "These are the only non-INFO nova-api lines in the corpus: 2 ERROR, 2 CRITICAL, 2 WARNING, all inside the two 503 requests. Only 2 lines mention token validation. Status mix over the whole corpus: 200=90633, 202=2065, 204=2064, 404=3969, 503=2. 503 is isolated and very rare."
    sql: "SELECT severity, count(*) FROM logs WHERE dataset='openstack' AND component='nova-api' AND severity IN ('ERROR','CRITICAL','WARNING') GROUP BY 1 ; SELECT count(*) FROM logs WHERE dataset='openstack' AND body @@ websearch_to_tsquery('validate token') ; SELECT status, count(*) FROM logs WHERE dataset='openstack' AND status IS NOT NULL GROUP BY 1"
    result: "CRITICAL|2, ERROR|2, WARNING|2 ; 2 ; 200|90633 202|2065 204|2064 404|3969 503|2"
    importance: must
  - fact: "Before each 503 the system was healthy. Tenant 54fadb... polled servers/detail about every 1.3 s, all 200 with ~0.25 s latency, and a successful POST /servers (202) plus VM create/delete activity on nova-compute were nearby. Nothing on nova-compute or nova-scheduler leads up to the 503. Only nova-api auth was hit."
    sql: "SELECT line_id, ts, severity, component, request_id, status, left(body,140) FROM logs WHERE dataset='openstack' AND ts BETWEEN '2017-05-16 06:24:30' AND '2017-05-16 06:25:40' ORDER BY ts, line_id LIMIT 80"
    result: "06:24:52-06:25:01: 12+ GET .../servers/detail status 200 (time ~0.25-0.36 s); 06:24:48.767 POST /servers 202 then compute 'Claim successful'; all INFO except imagecache 'Unknown base file' WARNINGs on nova-compute (routine). The first non-INFO nova-api line is 70743 ERROR at 06:25:02.867."
    importance: should
  - fact: "After the 503s: on 05-16 the corpus has a gap from 06:25:02.87 to 15:15:54 (the 503 is the last line of raw file openstack_normal1.log), so the logs show nothing about what followed. On 05-17 the tenant's polling of /v2/54fadb.../servers stops for good. Nova-api volume drops from ~4300 lines/h to 12/h for the rest of the corpus, while VM 96c58299 still finishes spawning at 06:25:06 ('Took 22.16 seconds to build instance')."
    sql: "SELECT strftime(date_trunc('hour',ts),'%m-%d %H'), count(*) FILTER (WHERE component='nova-api') FROM logs WHERE dataset='openstack' AND ts >= '2017-05-17 04:00' GROUP BY 1 ORDER BY 1 ; SELECT min(ts), count(*) FROM logs WHERE dataset='openstack' AND component='nova-api' AND ts > '2017-05-17 06:25:03.05' AND body LIKE '%54fadb412c4e40cdbaed9335e4c35a9e/servers%' ; SELECT strftime(date_trunc('hour',ts),'%m-%d %H'), count(*) FROM logs WHERE dataset='openstack' AND ts BETWEEN '2017-05-16 04:00' AND '2017-05-16 17:00' GROUP BY 1 ORDER BY 1"
    result: "05-17 04|4316, 05|4294, 06|1825, 07..11|12 each ; next tenant servers call after 503: none (0 rows) ; 05-16 04|8144 05|8158 06|3371 then 15|5985 (no 07-14 rows)"
    importance: should
  - fact: "Request-id oddity: each 503 request_id also appears on a 200 access line about 1 s earlier (same id in the raw file). These two are the only request_ids in the corpus with two status lines. Grouping by request_id makes it look like one request that both succeeded and failed."
    sql: "SELECT n, count(*) FROM (SELECT request_id, count(*) n FROM logs WHERE dataset='openstack' AND component='nova-api' AND status IS NOT NULL AND request_id IS NOT NULL GROUP BY 1) t GROUP BY 1 ORDER BY 1"
    result: "1|89533 ; 2|2 (req-1cc7d50c..., req-abcdb287...)"
    importance: nice
  - fact: "The daily 06:25 timing lines up with nova-api log rotation. In raw openstack_normal2.log the rotated file nova-api.log.1.2017-05-17_12:02:19 ends with the 503 line (raw line 123319), and nova-api.log.2017-05-17_12:02:19 starts at 06:25:06.592. nova-compute/nova-scheduler also switch files at 06:25:05/06:25:31. This is consistent with a daily scheduled job (Ubuntu cron.daily runs at 06:25), which would also explain a brief identity-service unavailability. Hypothesis only: not established from the DB rows."
    sql: "(raw file check, not SQL) awk on data/raw/openstack/openstack_normal2.log: first line of each source file name ; SQL proxy: SELECT component, min(ts) FROM logs WHERE dataset='openstack' AND ts > '2017-05-17 06:25:03.05' GROUP BY 1"
    result: "123320 nova-compute.log.2017-05-17_12:02:35 06:25:05.141 ; 123323 nova-api.log.2017-05-17_12:02:19 06:25:06.592 ; 123379 nova-scheduler.log.2017-05-17_12:02:19 06:25:31.372 ; SQL: nova-compute 06:25:05.141, nova-api 06:25:06.592, nova-scheduler 06:25:31.372"
    importance: nice
must_conclude:
  - "There are exactly 2 HTTP 503 responses, on 2017-05-16 06:25:02 and 2017-05-17 06:25:03, both GET servers/detail for tenant 54fadb... from 10.11.10.1."
  - "The 503 comes from failed token validation against the identity service (Keystone returned 503: 'Bad response code while validating token: 503' / 'Unable to validate token: Failed to fetch token data from identity server'). It is not a nova-api or nova-compute fault."
  - "Show the 3-line ERROR/WARNING/CRITICAL sequence in the same request just before each 503, with timestamps or line ids."
  - "It recurs at the same time of day (about 06:25) on both days. That suggests a scheduled or periodic cause on the identity side, labelled as a hypothesis."
  - "Next step: check Keystone/identity-server logs and the host's scheduled jobs (cron/logrotate, web-server reloads) around 06:25. The root cause is not in these logs."
  - "Scope: 2 requests, isolated and short (ms-level fast fail), with healthy 200s right before. Not an outage."
traps:
  - "Saying the 503s were caused by nova-compute, the scheduler, VM spawns or the imagecache errors (Traceback / InvalidDiskInfo). Those are unrelated nova-compute ERRORs."
  - "Counting the ERROR + WARNING + CRITICAL + access lines (8 lines) as multiple incidents. There are 2 failed requests, one per day."
  - "Calling it a sustained outage, or inventing duration or user impact. Each failure is a single ~10 ms request."
  - "Treating request_id req-1cc7d50c / req-abcdb287 as one request that 'returned 200 then 503'. The same id appears on an earlier 200 line, a logging oddity."
  - "Saying the client retried and succeeded afterwards. On 05-16 the corpus gap (06:25 to 15:15) hides what came next, and on 05-17 the tenant's polling stops."
  - "Saying Keystone was down for hours or that the drop in nova-api traffic after 06:25 on 05-17 was caused by the 503. That is correlation only. The workload or collection may simply have ended."
  - "Stating the logrotate/cron explanation as fact."
  - "Linking the 503s to the labelled anomalous instances (all on 2017-05-14 21:07-21:48)."
not_established:
  - "Why the identity service (Keystone) returned 503. Its logs are not in the corpus."
  - "Whether the scheduled job / log rotation at 06:25 actually caused it (timing coincidence only)."
  - "Whether the client retried and succeeded (05-16 is followed by a 9-hour corpus gap, 05-17 by the end of tenant polling)."
  - "Any user or customer impact beyond these 2 failed GET servers/detail calls."
  - "Whether 503s happened at 06:25 on other days (only 05-16 and 05-17 cover 06:25. 05-14 data starts at 19:39)."
labels_used: "The OpenStack labels (4 anomalous VM instance ids: 544fd51c, ae651dff, a445709b, 1643649d) do not apply. Their log lines all fall on 2017-05-14 21:07-21:48, far from the 503s, and the 503 requests (servers/detail list calls) reference no instance. The labels only rule out a link to the injected anomalies."
golden_check:
  - fact: "nova-api requests with status 503"
    golden_value: "2"
    my_value: "2"
    agrees: true
  - fact: "first 503"
    golden_value: "2017-05-16 06:25"
    my_value: "2017-05-16 06:25 (06:25:02.870, line 70746)"
    agrees: true
notes: "The question presumes a cause. The logs show the proximate cause (identity-service 503 during token validation) but not the root cause. A top answer separates the two. The DB was being reloaded by another process mid-investigation (openstack rows temporarily 0). All values were re-verified after the reload and line_ids were unchanged. The log-rotation timing comes from the raw files' source-file prefix, which the logs table does not store. An agent can only infer it from the per-component restart of lines and the 06:25 recurrence, so treat it as a bonus, not a requirement."
