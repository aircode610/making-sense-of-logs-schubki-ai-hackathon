id: D-L03
role: lead
dataset: openstack
question: "In OpenStack, how many requests failed with HTTP 404 and 503, on which nova service, and which team owns that service?"
answer_summary: "3,969 requests returned HTTP 404 and 2 returned HTTP 503, all of them logged by nova-api, which team cloud-api owns (data/ownership.csv). Each status line is one HTTP request, so line count equals request count here. Out of 98,733 status-bearing requests that is about 4.0% 404s. The 404s are almost certainly expected behaviour, not an incident: 2,064 are POST /os-server-external-events, one about 3.6 s after each of the 2,064 VM DELETEs (the post-delete network event for an instance that is already gone), and 1,905 are GET /openstack/2013-10-17/user_data metadata lookups from booting VMs that have no user data. The 2 503s are the real errors: on 2017-05-16 06:25:02 and 2017-05-17 06:25:03 (about 24 h apart) nova-api could not validate a token because the identity server (Keystone) answered 503 (ERROR, WARNING and CRITICAL lines in the same request). The lead should treat the 503s as the item to follow up with the identity owner, ask why it fires daily at 06:25, and not escalate the 404 volume."
findings:
  - fact: "3,969 lines/requests with HTTP 404 and 2 with HTTP 503, all on component nova-api (3,054 distinct request ids among the 404s because 915 metadata lines carry no req id; every 503 has its own request id)."
    sql: "SELECT status, component, count(*), count(DISTINCT request_id), min(ts), max(ts) FROM logs WHERE dataset='openstack' AND status IN (404,503) GROUP BY 1,2"
    result: "404|nova-api|3969|3054|2017-05-14 19:39:29.765|2017-05-17 06:25:17.855 ; 503|nova-api|2|2|2017-05-16 06:25:02.87|2017-05-17 06:25:03.049"
    importance: must
  - fact: "nova-api is owned by team cloud-api (nova-compute and nova-scheduler are owned by cloud-compute)."
    sql: "SELECT * FROM ownership WHERE dataset='openstack'"
    result: "openstack|nova-api|cloud-api|Nova REST API ... ; nova-compute|cloud-compute ; nova-scheduler|cloud-compute"
    importance: must
  - fact: "Baseline: 98,733 requests carry a status: 200=90,633, 404=3,969 (about 4.0%), 202=2,065, 204=2,064, 503=2. Only 404 and 503 are error statuses."
    sql: "SELECT status, count(*) FROM logs WHERE dataset='openstack' AND status IS NOT NULL GROUP BY 1 ORDER BY 2 DESC"
    result: "200|90633 ; 404|3969 ; 202|2065 ; 204|2064 ; 503|2"
    importance: should
  - fact: "The 404s come from exactly two endpoints: POST /v2/<tenant>/os-server-external-events (2,064) and GET /openstack/2013-10-17/user_data (1,905, the metadata service, one per VM IP)."
    sql: "SELECT regexp_extract(body,'\"(GET|POST|DELETE|PUT) (\\S+)',1) m, regexp_replace(regexp_extract(body,'\"(GET|POST|DELETE|PUT) (\\S+)',2),'[0-9a-f]{8}-[0-9a-f-]{27}|[0-9a-f]{32}','<ID>','g') p, count(*) FROM logs WHERE dataset='openstack' AND status=404 GROUP BY 1,2 ORDER BY 3 DESC"
    result: "POST|/v2/<ID>/os-server-external-events|2064 ; GET|/openstack/2013-10-17/user_data|1905"
    importance: must
  - fact: "The external-events 404s are tied one-to-one to VM deletions: 2,064 DELETE 204s and 2,064 external-event 404s; paired in time order the 404 follows the DELETE by about 3.6 s on average. The 2,065 external-event 200s are the network-vif-plugged events at VM create (2,065 POST 202 creates). So the 404s are routine post-delete events for instances that no longer exist."
    sql: "SELECT avg(ttc) FROM (SELECT extract(epoch FROM b.ts-a.ts) ttc FROM (SELECT ts, row_number() OVER (ORDER BY ts) r FROM logs WHERE dataset='openstack' AND status=204) a JOIN (SELECT ts, row_number() OVER (ORDER BY ts) r FROM logs WHERE dataset='openstack' AND status=404 AND body LIKE '%external-events%') b USING (r))"
    result: "3.5955 (also: DELETE|204|2064, POST|202|2065; Creating event network-vif-plugged ... |2065)"
    importance: should
  - fact: "Both 503s are GET /v2/54fadb.../servers/detail, and each is preceded within 3 ms in the same request by 'Bad response code while validating token: 503' (ERROR), 'Identity response: <!DOCTYPE HTML...' (WARNING), 'Unable to validate token: Failed to fetch token data from identity server' (CRITICAL). The identity server (Keystone) was unavailable, not nova itself. These are the only ERROR/CRITICAL lines of nova-api in the whole dataset."
    sql: "SELECT ts, severity, request_id, left(body,120) FROM logs WHERE dataset='openstack' AND component='nova-api' AND ts BETWEEN '2017-05-17 06:25:01' AND '2017-05-17 06:25:04' ORDER BY ts LIMIT 20"
    result: "06:25:03.044 ERROR req-abcdb287 Bad response code while validating token: 503 ; 06:25:03.045 WARNING Identity response ; 06:25:03.046 CRITICAL Unable to validate token ; 06:25:03.049 INFO ... status: 503 len: 323 (same pattern on 2017-05-16 06:25:02.867-.870, req-1cc7d50c); nova-api ERROR=2, CRITICAL=2"
    importance: must
  - fact: "Trend: 404s by day 2017-05-14=369, 05-16=2,525, 05-17=1,075, proportional to total traffic (9,416 / 62,667 / 26,650 status lines), so no rising 404 rate. The 503s occur once per day at about 06:25 (05-16 and 05-17)."
    sql: "SELECT date_trunc('day',ts) d, status, count(*) FROM logs WHERE dataset='openstack' AND status IN (404,503) GROUP BY 1,2 ORDER BY 1,2"
    result: "05-14|404|369 ; 05-16|404|2525 ; 05-16|503|1 ; 05-17|404|1075 ; 05-17|503|1"
    importance: nice
must_conclude:
  - "404 = 3,969 requests and 503 = 2 requests (one status line per request, so these are requests, not just lines)."
  - "All of them are on nova-api."
  - "nova-api is owned by cloud-api."
  - "The 503s are the real failures: token validation against the identity service returned 503. Follow up there (it recurs daily at about 06:25). The 404 volume is mostly expected (post-delete external events, metadata user_data with no user data) and is not an outage."
traps:
  - "Saying cloud-compute owns the failures, or blaming nova-compute or nova-scheduler: they log no HTTP status."
  - "Treating 3,969 404s as 3,969 incidents or as an outage. They split into two routine endpoint patterns, one per VM delete and one per VM boot."
  - "Using the 3,054 distinct request ids as the request count. 915 metadata 404 lines have no req id, but each status line is still one HTTP request."
  - "Counting body text matches for '404' or '503' (e.g. 'Bad response code while validating token: 503' is not a request status, and len values can contain digits). The status column / 'status: N' gives 3,969 and 2."
  - "Saying nova-api itself was down for the 503s. The logs show the identity server failing token validation."
  - "Linking the 404s/503s to the labelled anomalous VMs: the status lines carry no instance id, and nothing ties them."
not_established:
  - "Why the identity server returned 503 (Keystone logs are not in the corpus), and whether the daily 06:25 timing is a scheduled job (token flush, restart, rotation)."
  - "Whether the external-event 404s come from Neutron, or which event types they carry (the 404 request lines do not name the event). The pairing with deletes is by count and timing."
  - "Any user or customer impact of the 2 failed servers/detail calls (the client at 10.11.10.1 polls servers/detail about every 0.3-1 s, so a retry is likely, but the logs do not show it)."
  - "Whether nova-api is configured to expect user_data (the metadata 404 means 'no user data for this instance', presumably)."
labels_used: "None apply. OpenStack labels are 4 anomalous VM instance ids, and the HTTP status lines carry no instance id, so the labels neither confirm nor bound these counts."
golden_check:
  - fact: "requests with status 404"
    golden_value: "3969"
    my_value: "3969 (status column; same from body LIKE '%status: 404%')"
    agrees: true
  - fact: "requests with status 503"
    golden_value: "2"
    my_value: "2 (status column; same from body LIKE '%status: 503%')"
    agrees: true
notes: "The question reads 'which nova service', singular: the answer is nova-api for both statuses. The dataset is 2017-05-14 and 05-16 to 05-17 (no 05-15 lines). A strong lead answer adds the split of the 404s into the two routine endpoints and identifies the 503s as identity-service token failures. Answers that give only the counts plus nova-api and cloud-api meet the minimum."
