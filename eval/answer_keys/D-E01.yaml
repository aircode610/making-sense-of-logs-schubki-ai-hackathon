id: D-E01
role: engineer
dataset: bgl
question: "What failed on the R43-M0 midplane around 2005-08-19 13:56, and what happened just before and after?"
answer_summary: "Two I/O nodes on midplane R43-M0 logged a bare 'kernel panic' (KERNEL, FATAL) at 2005-08-19 13:56:00: R43-M0-NC-I:J18-U01 (line 3069219) and R43-M0-N8-I:J18-U11 (line 3069220). That is 2 lines on 2 nodes, i.e. one event on one midplane. The other 6 I/O nodes of R43-M0 and the rest of the machine logged nothing between 13:17 and 17:11. The last thing before it was a fleet-wide ciod LOGIN failure storm at 12:24-12:26: 1024 FATAL APP lines on 1024 I/O nodes across 128 midplanes, all 'LOGIN chdir(/home/auselton/testing) failed' or 'Link has been severed' to 172.16.96.116. R43-M0 got 8 of those lines, one on each of its 8 I/O nodes, and both panicking nodes were among them. Afterwards the same fleet-wide ciod login storm came back at 17:11-17:13, with R43-M0 again on all 8 I/O nodes, the two panicked nodes included. So they were logging again within about 3h16m, but no reboot line appears. The panic lines carry no detail, so the logs do not give a root cause, and it is not established that the login storm caused the panic."
findings:
  - fact: "Exactly 2 'kernel panic' lines on R43-M0 in the window, both at 13:56:00, on 2 distinct I/O nodes (NC-I:J18-U01 and N8-I:J18-U11), both labelled KERNPAN. The message body is just 'kernel panic', with no further detail."
    sql: "SELECT l.line_id, strftime(ts,'%Y-%m-%d %H:%M:%S.%f'), severity, component, node, body, (SELECT label FROM labels b WHERE b.dataset='bgl' AND b.line_id=l.line_id) FROM logs l WHERE dataset='bgl' AND location @@ ts_tokenize('R43/R43-M0','keyword') AND ts >= '2005-08-19 12:00' AND ts < '2005-08-19 16:00' ORDER BY ts, line_id LIMIT 50"
    result: "3069219|2005-08-19 13:56:00.280831|FATAL|KERNEL|R43-M0-NC-I:J18-U01|kernel panic|KERNPAN ; 3069220|2005-08-19 13:56:00.628434|FATAL|KERNEL|R43-M0-N8-I:J18-U11|kernel panic|KERNPAN (the other 8 rows in 12:00-16:00 are the 12:24-12:26 ciod lines)"
    importance: must
  - fact: "Just before (12:24-12:26), R43-M0 logged 8 FATAL APP ciod lines, one on each of its 8 I/O nodes (N0/N4/N8/NC x J18-U01/U11). 6 are 'ciod: LOGIN chdir(/home/auselton/testing) failed: No such file or directory' and 2 (N8 U11/U01, lines 3069072-3069073, APPSEV) are 'Error reading message prefix after LOGIN_MESSAGE on CioStream socket to 172.16.96.116: Link has been severed'. Both later-panicking nodes are among them: NC-U01 had chdir failed at 12:26:12, N8-U11 had link severed at 12:26:09."
    sql: "(same query as above)"
    result: "3068403..3069103, 12:24:59-12:26:12, 8 rows, nodes R43-M0-N4-I:J18-U11/U01, N0-I:J18-U11/U01, N8-I:J18-U11/U01 (APPSEV), NC-I:J18-U11/U01"
    importance: must
  - fact: "That pre-panic ciod storm was fleet-wide, not specific to R43-M0. It was 1024 APP lines on 1024 distinct nodes across 128 midplanes in under 2 minutes. R43-M0 was one of 128 midplanes hit, and the only one that panicked afterwards."
    sql: "SELECT count(*), count(DISTINCT node), count(DISTINCT substr(node,1,6)), min(ts), max(ts) FROM logs WHERE dataset='bgl' AND ts >= '2005-08-19 12:00' AND ts < '2005-08-19 13:00' AND component='APP'"
    result: "1024|1024|128|2005-08-19 12:24:35.820024|2005-08-19 12:26:26.673471"
    importance: must
  - fact: "Fleet-wide, the panic was the only activity between 13:17 and 17:11. By line order: corrected DDR / torus CE INFO lines on other racks (R30, R35, R55, R73, R44) at 13:17:10-11, then the 2 R43-M0 panics (3069219-3069220), then nothing until 17:11:25. There are no hardware, MMCS or other precursor lines on R43-M0 between 12:26:12 and 13:56."
    sql: "SELECT line_id, strftime(ts,'%m-%d %H:%M:%S.%f'), severity, component, node, left(body,110) FROM logs WHERE dataset='bgl' AND line_id BETWEEN 3069160 AND 3069300 ORDER BY line_id LIMIT 150"
    result: "3069206-3069218 = 13:17 ddr/torus corrected errors on non-R43 nodes; 3069219-3069220 = 13:56 R43-M0 kernel panic; 3069221 = 17:11:25 next line (ciod LOGIN chdir failed on R56-M1-N0-I)"
    importance: should
  - fact: "Just after, the same fleet-wide ciod login storm recurred at 17:11-17:13 (1024 lines, 1024 nodes, 128 midplanes). R43-M0 logged it on all 8 I/O nodes at 17:12:37-17:12:45, including both nodes that had panicked (N8-U11 chdir failed; NC-U01 chdir failed). So they were up and running ciod again within about 3h16m. No reboot or boot line is logged. Later lines on R43-M0 that day: 1 corrected DDR error on compute node R43-M0-N7-C:J05-U01 at 23:27, which is INFO and unrelated."
    sql: "SELECT line_id, strftime(ts,'%H:%M:%S'), severity, component, node, left(body,90) FROM logs WHERE dataset='bgl' AND location @@ ts_tokenize('R43/R43-M0','keyword') AND ts >= '2005-08-19 17:00' AND ts < '2005-08-20' ORDER BY ts, line_id LIMIT 20 ; storm scope: SELECT count(*), count(DISTINCT node), count(DISTINCT substr(node,1,6)), min(ts), max(ts) FROM logs WHERE dataset='bgl' AND ts >= '2005-08-19 17:00' AND ts < '2005-08-19 17:30' AND component='APP'"
    result: "8 ciod rows 17:12:37-17:12:45 on all 8 R43-M0 I/O nodes; then 3 INFO ddr-corrected rows on R43-M0-N7-C:J05-U01 at 23:27-23:28. Storm: 1024|1024|128|17:11:25|17:13:17"
    importance: should
  - fact: "Kernel panics are rare in BGL: 18 lines on 18 nodes / 14 midplanes over the whole dataset, all on I/O nodes (J18). This was the only panic on R43-M0 ever, and the only one that day. Other clusters were on 08-15 (3 nodes) and 08-23 (5 nodes, R57-M1/R66/R67)."
    sql: "SELECT count(*), count(DISTINCT node), count(DISTINCT substr(node,1,6)), min(ts), max(ts) FROM logs WHERE dataset='bgl' AND body @@ websearch_to_tsquery('kernel panic')"
    result: "18|18|14|2005-08-15 16:31:53|2005-11-11 13:51:11 (listing shows R43-M0 only at 2005-08-19 13:56)"
    importance: should
  - fact: "Day context: R43-M0 logged 21 lines on 9 nodes on 2005-08-19, and nothing earlier that day. Its previous activity was 2005-08-18 14:19 ('ciod: generated 64 core files for program .../sppm_chkpt/run/sppm', INFO, on all 8 I/O nodes). Labels on R43-M0 that day are APPSEV x3 and KERNPAN x2."
    sql: "SELECT count(*), count(DISTINCT node) FROM logs WHERE dataset='bgl' AND location @@ ts_tokenize('R43/R43-M0','keyword') AND ts >= '2005-08-19' AND ts < '2005-08-20' ; SELECT b.label, count(*) FROM logs l JOIN labels b ON b.dataset='bgl' AND b.line_id=l.line_id WHERE l.dataset='bgl' AND location @@ ts_tokenize('R43/R43-M0','keyword') AND ts >= '2005-08-19' AND ts < '2005-08-20' GROUP BY 1"
    result: "21|9 ; APPSEV|3, KERNPAN|2"
    importance: nice
must_conclude:
  - "The failure was a kernel panic on 2 I/O nodes of R43-M0 (R43-M0-NC-I:J18-U01 and R43-M0-N8-I:J18-U11) at 2005-08-19 13:56:00. It is 2 lines on 2 nodes, a single event, and not fleet-wide."
  - "Before: the 12:24-12:26 ciod LOGIN failures (chdir /home/auselton/testing, link severed to 172.16.96.116) hit all 8 R43-M0 I/O nodes. They were part of a fleet-wide storm (1024 nodes / 128 midplanes), so they are not specific to R43-M0. After that, nothing until the panic, about 90 min later."
  - "After: the log is silent fleet-wide until 17:11, then the same ciod login storm returns and the panicked nodes log again at 17:12. No reboot or recovery line is logged."
  - "The root cause is not in the logs. The panic lines have no detail, and a link to the login storm is only a hypothesis. Next step: check the console / RAS dump of those two I/O nodes and the job running on R43-M0 at 13:56."
traps:
  - "Calling the 12:26 ciod 'LOGIN chdir failed' / 'Link has been severed' lines the R43-M0 failure, or its proven cause. They hit 1024 I/O nodes on 128 midplanes, and only R43-M0 panicked."
  - "Saying the whole midplane (all 8 I/O nodes, or the compute nodes) panicked. Only 2 of its 8 I/O nodes did."
  - "Counting the 13:17 DDR / torus corrected errors as precursors. They are INFO, corrected, and on other racks (R30, R35, R55, R73, R44), not R43."
  - "Counting the 23:27 corrected DDR error on R43-M0-N7-C:J05-U01 as part of the incident. It is unrelated INFO about 9.5 h later."
  - "Reporting the FATAL APP ciod lines as 8 (or 16, with 17:12) separate failures or incidents. They are one login-storm episode per occurrence."
  - "Using a narrow window (e.g. 13:50-14:00) and concluding nothing happened before or after. The neighbouring events are 90 min before and 3h15m after, because the log is sparse here."
  - "Claiming the nodes were rebooted or recovered at a specific time. No boot line exists; they only reappear at 17:12."
not_established:
  - "Why the kernel panicked: no stack, error code or hardware fault is logged on R43-M0 before the panic."
  - "Whether the ciod login failures (user auselton's job) caused the panic. They are correlated in time only, and 127 other midplanes got the same lines without panicking."
  - "Which job was running on R43-M0 at 13:56, and whether it was killed. There are no job or MMCS lines for R43-M0 in the window."
  - "When or how the two I/O nodes were recovered (no reboot line). Also any downtime or user impact."
labels_used: "Labels confirm both 13:56 lines are KERNPAN alerts and that the 2 'Link has been severed' lines on N8 at 12:26 (and 1 at 17:12) are APPSEV. The 'LOGIN chdir failed' lines are unlabelled ('-'). R43-M0 on 2005-08-19 has KERNPAN x2 and APPSEV x3, nothing else. Labels mark alert lines, not incidents."
golden_check:
  - fact: "kernel panic lines on R43-M0, 2005-08-19 13:40-14:15"
    golden_value: "2"
    my_value: "2 (lines 3069219, 3069220; 2 distinct I/O nodes)"
    agrees: true
  - fact: "first panic time"
    golden_value: "2005-08-19 13:56"
    my_value: "2005-08-19 13:56 (13:56:00.280831, R43-M0-NC-I:J18-U01)"
    agrees: true
notes: "The BGL log is very sparse around this event. Fleet-wide, only 15 lines fall between 12:26:27 and 17:11:25, so a get_context by line neighbourhood (line_id 3069219 +/- n) is the right way to show before/after. A strict time window will look empty. 'Midplane R43-M0' maps to location prefix R43/R43-M0. Ownership: KERNEL -> node-platform, APP (ciod login lines) -> hpc-workloads (data/ownership.csv). This is not required for an engineer answer but is fine to mention."
