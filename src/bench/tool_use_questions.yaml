# Role-free MCP benchmark (plan 012): questions as a person would ask any agent that has only our MCP server.
# Written by Claude after seeing the data (dev only; the blind A/B of plan 013 and the human held-out set are the honest
# tests). Facts: `sql` = hand-written reference query on raw logs, run fresh by bench/tool_use.py (match: number | date
# 'YYYY-MM-DD HH:MM' | text); or a literal `value` checked by hand when written.
# first: acceptable first substantive tools (discovery tools describe_corpus / list_values are skipped when scoring).
# need: groups of tools; the run should use at least one tool of every group.

- id: T-B1
  dataset: bgl
  question: Something failed on the R43-M0 midplane of the BGL supercomputer around 2005-08-19 13:56. What was it, and what happened just before and after?
  first: [search_logs, get_context, burst_timeline, facet]
  need: [[search_logs], [get_context, burst_timeline]]
  facts:
  - {fact: kernel panic lines on R43-M0 13:40-14:15, sql: "SELECT count(*) FROM logs WHERE dataset='bgl' AND node LIKE 'R43-M0-%' AND body @@ websearch_to_tsquery('kernel panic') AND ts >= '2005-08-19 13:40' AND ts < '2005-08-19 14:15'"}
  - {fact: first panic, match: date, sql: "SELECT strftime(min(ts), '%Y-%m-%d %H:%M') FROM logs WHERE dataset='bgl' AND node LIKE 'R43-M0-%' AND body @@ websearch_to_tsquery('kernel panic') AND ts >= '2005-08-19 13:40' AND ts < '2005-08-19 14:15'"}
